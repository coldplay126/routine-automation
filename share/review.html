<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>스크럼 초안 검토 — @@REVIEW_DAY@@</title>
<style>
:root { color-scheme: light dark; --bg: #fff; --fg: #202124; --panel: #f5f5f5; --border: #767676; --button: #174ea6; --button-fg: #fff; --badge: #e8eef8; --badge-fg: #193b69; --attention: #fff0c2; --attention-fg: #624800; --held: #eee5f5; --held-fg: #54326d; }
@media (prefers-color-scheme: dark) { :root { --bg: #17191c; --fg: #f1f3f4; --panel: #24272c; --border: #9aa0a6; --button: #a8c7fa; --button-fg: #102d52; --badge: #253f5b; --badge-fg: #d3e5ff; --attention: #493b18; --attention-fg: #ffe7a3; --held: #3c2d4c; --held-fg: #eed8ff; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width: 1440px; padding: 28px; margin: auto; }
h1 { margin: 0; font-size: 1.7rem; } h2 { font-size: 1.2rem; } p { margin: .6rem 0; }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 20px 0; }
button, .button { background: var(--button); color: var(--button-fg); border: 0; border-radius: 7px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.preview-panel { position: sticky; top: 20px; background: var(--panel); padding: 20px; border: 1px solid var(--border); border-radius: 10px; max-height: calc(100vh - 40px); overflow: auto; }
.preview-panel h2 { margin-top: 0; }
#preview ul { list-style: none; padding-left: 1.4rem; margin: 0; } #preview > ul { padding-left: 0; margin-bottom: 1rem; }
#preview li { position: relative; } #preview li::before { content: "•"; display: inline-block; width: 1.15rem; } #preview li li::before { content: "◦"; } #preview li li li::before { content: "▪"; }
#preview, .editable, .excerpt, code, .reasons, .path { overflow-wrap: anywhere; white-space: pre-wrap; }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
.item-heading { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; } label, summary { cursor: pointer; }
input[type=checkbox] { width: 19px; height: 19px; vertical-align: middle; margin-right: 6px; }
.badge { color: var(--badge-fg); background: var(--badge); padding: 2px 9px; border-radius: 20px; font-size: .85rem; font-weight: 600; }
.attention { color: var(--attention-fg); background: var(--attention); } .held { color: var(--held-fg); background: var(--held); }
.path { font-size: .9rem; } .editable { border: 1px solid var(--border); border-radius: 6px; min-height: 3rem; padding: 10px; margin: 12px 0; }
details { border-top: 1px solid var(--border); padding-top: 10px; } details ul, .reasons { padding-left: 1.5rem; } code { font-family: ui-monospace, monospace; font-size: .85rem; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 8px; padding: 12px 20px; max-width: 90vw; } #toast:empty { display: none; }
@media (max-width: 850px) { main { padding: 18px; } .layout { grid-template-columns: 1fr; } .preview-panel { position: static; max-height: none; } }
</style>
</head>
<body>
<main>
<header><h1>스크럼 초안 검토</h1><p>@@REVIEW_DAY@@ · 문구와 근거를 확인하고 포함할 항목을 선택하세요.</p><p>복사와 채널 열기만 지원합니다. Slack에 직접 붙여넣고 전송하세요. 편집은 이 화면에만 유지되며 새로고침하면 초기화됩니다.</p></header>
<div class="toolbar"><button id="copy" type="button">복사</button><a class="button" href="@@REVIEW_CHANNEL@@">Slack 채널 열기</a><span id="selection-count" role="status"></span></div>
<div class="layout"><section aria-label="항목 편집">@@REVIEW_ITEMS@@</section><aside class="preview-panel" aria-label="선택 항목 미리보기"><h2>미리보기</h2><div id="preview">@@REVIEW_PREVIEW@@</div></aside></div>
<div id="toast" role="status" aria-live="polite"></div>
</main>
<script id="review-data" type="application/json">@@REVIEW_DATA@@</script>
<script>
'use strict';
const data = JSON.parse(document.getElementById('review-data').textContent);
const preview = document.getElementById('preview');
const settings = data.settings;
const format = Object.assign({bullets: ['•', '◦', '▪', '▪'], layout: 'tree', max_items_per_section: null}, settings.format || {});
const customBullets = JSON.stringify(format.bullets) !== JSON.stringify(['•', '◦', '▪', '▪']);
const bullet = depth => format.bullets[Math.min(depth, format.bullets.length - 1)];
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
// jq sorts Unicode code points, not locale collation or UTF-16 code units.
function compare(a, b) {
  let left = 0, right = 0;
  while (left < a.length && right < b.length) {
    const x = a.codePointAt(left), y = b.codePointAt(right);
    if (x !== y) return x - y;
    left += x > 0xffff ? 2 : 1; right += y > 0xffff ? 2 : 1;
  }
  return (left < a.length ? 1 : 0) - (right < b.length ? 1 : 0);
}
// Older draft files discarded path uncertainty; recover it from their own tree.
data.items.forEach(item => {
  if (Array.isArray(item.path_uncertain)) return;
  let roots = data[item.section] || [];
  if (settings.project && roots[0] && roots[0].children) roots = roots[0].children;
  const matches = (node, value) => node.label === value || node.label === value + ' (확인 필요)';
  const category = roots.find(node => matches(node, item.path[0]));
  const topic = category && (category.children || []).find(node => matches(node, item.path[1]));
  item.path_uncertain = [Boolean(category && category.label !== item.path[0]), Boolean(topic && topic.label !== item.path[1])];
});
function label(value, group, depth) {
  const uncertain = group.some(item => (item.path_uncertain || [])[depth]);
  return value + (settings.markers !== 'none' && uncertain ? ' (확인 필요)' : '');
}
function selectedItems(section) {
  return data.items.filter(item => item.selected && !item.disabled && item.text.length > 0 && item.section === section);
}
function tree(section) {
  const selected = selectedItems(section);
  const visible = format.max_items_per_section === null ? selected : selected.slice(0, format.max_items_per_section);
  function topics(group) {
    return [...new Set(group.map(item => item.path[1]))].sort(compare).flatMap(topic => {
      const tasks = group.filter(item => item.path[1] === topic);
      const direct = tasks.filter(item => item.direct).map(item => ({text: item.text}));
      const nested = tasks.filter(item => !item.direct).map(item => ({text: item.text}));
      return direct.concat(nested.length ? [{label: label(topic, tasks, 1), children: nested}] : []);
    });
  }
  const categories = [...new Set(visible.map(item => item.path[0]))].sort((a, b) => {
    const rank = value => { const index = settings.categories.indexOf(value); return index < 0 ? 6 : index; };
    return rank(a) - rank(b) || compare(a, b);
  });
  const nodes = format.layout === 'flat' ? topics(visible) : categories.map(category => {
    const group = visible.filter(item => item.path[0] === category);
    return {label: label(category, group, 0), children: topics(group)};
  });
  return settings.project && nodes.length ? [{label: settings.project, children: nodes}] : nodes;
}
function htmlLines(nodes, depth = 0) {
  return nodes.flatMap(node => ['&nbsp;'.repeat(depth * 2) + esc(bullet(depth)) + ' ' + esc(node.children ? node.label : node.text)]
    .concat(node.children ? htmlLines(node.children, depth + 1) : []));
}
function htmlNodes(nodes) {
  if (customBullets) return '<div data-routine-bullets="custom">' + htmlLines(nodes).join('<br>') + '</div>';
  return '<ul>' + nodes.map(node => '<li>' + (node.children ? esc(node.label) + htmlNodes(node.children) : esc(node.text)) + '</li>').join('') + '</ul>';
}
function textNodes(nodes, depth = 0) { return nodes.flatMap(node => ['  '.repeat(depth) + bullet(depth) + ' ' + (node.children ? node.label : node.text)].concat(node.children ? textNodes(node.children, depth + 1) : [])); }
function render() {
  const yesterday = tree('yesterday'), today = tree('today');
  const html = '<b>' + esc(settings.headers.yesterday) + '</b>' + htmlNodes(yesterday) + '\n<b>' + esc(settings.headers.today) + '</b>' + htmlNodes(today);
  const text = [settings.headers.yesterday, ...textNodes(yesterday), '', settings.headers.today, ...textNodes(today)].join('\n');
  preview.innerHTML = html;
  const selected = ['yesterday', 'today'].reduce((total, section) => total + selectedItems(section).length, 0);
  const omitted = format.max_items_per_section === null ? 0 : ['yesterday', 'today'].reduce((total, section) => total + Math.max(0, selectedItems(section).length - format.max_items_per_section), 0);
  document.getElementById('selection-count').textContent = '선택 ' + selected + '개' + (omitted ? ' · 생략됨 ' + omitted + '개 (항목 수 상한)' : '');
  return {html, text};
}
document.querySelectorAll('[data-select]').forEach(input => input.addEventListener('change', () => { data.items[Number(input.dataset.select)].selected = input.checked; render(); }));
document.querySelectorAll('[data-edit]').forEach(editor => {
  editor.addEventListener('input', () => { data.items[Number(editor.dataset.edit)].text = editor.innerText.replace(/[\r\n]+/g, ' ').trim(); render(); });
  editor.addEventListener('paste', event => {
    event.preventDefault();
    const text = event.clipboardData.getData('text/plain');
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    const range = selection.getRangeAt(0);
    range.deleteContents(); const node = document.createTextNode(text); range.insertNode(node); range.setStartAfter(node); range.collapse(true); selection.removeAllRanges(); selection.addRange(range);
    editor.dispatchEvent(new Event('input', {bubbles: true}));
  });
  editor.addEventListener('drop', event => event.preventDefault());
});
let toastTimer;
function toast(message) { const status = document.getElementById('toast'); status.textContent = message; clearTimeout(toastTimer); toastTimer = setTimeout(() => { status.textContent = ''; }, 5000); }
document.getElementById('copy').addEventListener('click', async () => {
  const result = render();
  try {
    if (typeof ClipboardItem !== 'undefined' && navigator.clipboard && typeof navigator.clipboard.write === 'function') {
      await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([result.html], {type: 'text/html'}), 'text/plain': new Blob([result.text], {type: 'text/plain'})})]);
      toast('HTML과 텍스트를 복사했습니다. Slack에서 직접 붙여넣고 전송하세요.');
    } else {
      await navigator.clipboard.writeText(result.text);
      toast('텍스트를 복사했습니다. 이 브라우저는 HTML 복사를 지원하지 않습니다.');
    }
  } catch (error) { toast('복사하지 못했습니다. 브라우저의 클립보드 권한을 확인하세요.'); }
});
render();
</script>
</body>
</html>
